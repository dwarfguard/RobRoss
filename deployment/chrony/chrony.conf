# RobRoss physical-host Chrony policy: corrections are always slewed.
# Install as /etc/chrony/chrony.conf after reviewing the source pool for the site.
pool pool.ntp.org iburst maxsources 4 maxpoll 6
driftfile /var/lib/chrony/chrony.drift
rtcsync
leapsectz right/UTC
logdir /var/log/chrony

# Deliberately no makestep directive, including at startup. Synchronize and wait
# before ROS starts; never step CLOCK_REALTIME while robot software is active.
