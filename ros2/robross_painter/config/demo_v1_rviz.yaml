# RobRoss Demo v1 hardware/calibration profile for RViz (fake hardware) testing.
#
# This is deliberately separate from the artwork configs in the RobRoss repo:
# artwork/path files stay in canvas millimeters; everything robot-specific
# (paper pose, heights, speeds) lives here. For a real paper setup, replace
# canvas_origin_xyz / canvas_x_yaw_deg with values measured from taught
# paper corners.
painting_executor:
  ros__parameters:
    # Pose of the paper's top-left corner in base_link (meters).
    # z is the pen contact height. Default: A4 portrait lying flat,
    # centered 0.45 m in front of the robot, top edge away from the base.
    canvas_origin_xyz: [0.5985, 0.105, 0.15]
    # Direction of the canvas x axis (page "right") in the base XY plane,
    # degrees. -90 means canvas x runs along base -y; combined with the
    # origin above, the drawing appears unmirrored when viewed from above
    # in RViz with base +x pointing up.
    canvas_x_yaw_deg: -90.0
    # Pen hover height above the paper for travel moves (meters).
    safe_clearance_m: 0.02
    # Top of the ground collision plane in base_link z (meters). Planning
    # rejects any motion where an arm link would pass below this. Slightly
    # negative so the robot's own base, resting at z=0, is not flagged as
    # permanently in collision. Match this to the real mounting surface.
    ground_enabled: true
    ground_z_m: -0.005
    # Collision plane just behind/under the paper (wall / board / table top):
    # reject any plan where an arm/claw link pushes past the drawing plane.
    # The pen-tip TCP below gives the claw real standoff, so the wrist clears
    # this plane at contact and the sim checks the same geometry as hardware.
    # Size [0, 0] auto-sizes the patch to the canvas plus the margin per side.
    canvas_backing_enabled: true
    canvas_backing_clearance_m: 0.005
    canvas_backing_size_xy_m: [0.0, 0.0]
    canvas_backing_margin_m: 0.05
    # Pen-tip pose in ee_link (custom claw). Keep identical to hardware_a4.yaml
    # so this simulation checks the same tool geometry the real arm uses.
    tool_offset_xyz: [0.001208, -0.06034, 0.090753]
    tool_offset_rpy: [0.0, 0.0, 0.0]
    # Rotation of the claw about the pen axis, degrees. -90 reproduces the
    # wrist orientation of the earlier tool_rpy: [pi, 0, 0] setting.
    tool_spin_deg: -90.0
    # Box that fully encloses the claw, attached to ee_link so MoveIt
    # collision-checks it against the backing (the claw is not in the URDF).
    # Measured on the real claw; keep identical to hardware_a4.yaml.
    claw_collision_size_xyz: [0.02, 0.06, 0.02]
    claw_collision_offset_xyz: [0.0, -0.03, 0.0]
    velocity_scaling: 0.3
    acceleration_scaling: 0.3
    # Cartesian interpolation resolution (meters).
    eef_step_m: 0.005
    # Reject Cartesian paths whose consecutive IK solutions jump more than
    # this factor times the average joint step (an arm configuration flip).
    # Never set to 0: that disables the check and a flip executes as the
    # arm sweeping through unchecked space (self/ground collision).
    cartesian_jump_threshold: 2.0
    # Hard elbow-up policy: startup and every trajectory must remain in this
    # band. An out-of-band start aborts without moving the arm.
    elbow_up_enabled: true
    elbow_joint: foreArm_joint
    elbow_up_min_deg: -5.0
    elbow_up_max_deg: 175.0
    # Bound base-axis movement. The lower paint limit also catches a large
    # gradual swivel that would pass the relative Cartesian jump check.
    guarded_joints: [shoulder_joint, wrist3_joint]
    max_guarded_joint_goal_delta_deg: 120.0
    max_guarded_joint_travel_deg: 150.0
    max_guarded_joint_paint_travel_deg: 90.0
    max_guarded_joint_step_deg: 45.0
    max_cartesian_deviation_mm: 2.0
    max_cartesian_normal_deviation_mm: 0.2
    max_cartesian_orientation_deviation_deg: 2.0
    max_execution_tip_error_mm: 1.0
    max_execution_tip_orientation_error_deg: 1.0
    totg_path_tolerance: 0.01
    controller_sample_dt: 0.008
    # Endpoint settling: require the arm to reach and HOLD the planned endpoint
    # at rest before accepting a move. Contact moves use the shorter timeout; on
    # timeout the move fails closed. (Fake hardware settles near-instantly.)
    endpoint_settle_velocity_tolerance: 0.02   # rad/s "stationary" threshold
    endpoint_settle_dwell: 0.15                # s continuous in-tolerance hold
    endpoint_settle_timeout: 1.5               # s transit/lift budget
    endpoint_settle_contact_timeout: 0.6       # s lowering/painting budget
    endpoint_settle_sample_max_age: 0.05       # s max feedback age / sample gap
    joint_states_topic: /joint_states
    state_validity_service: /check_state_validity
    # true = plan everything but do not execute.
    dry_run: false
